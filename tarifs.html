<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection - QRGUIDE.FR</title>
    <link rel="icon" type="image/jpeg" href="img/logo_icone.jpg">
    <meta http-equiv="refresh" content="0; url=abonnement.html">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .redirect-container {
            text-align: center;
            padding: 40px;
        }
        .redirect-container h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .redirect-container p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 24px;
        }
        .redirect-container a {
            color: white;
            text-decoration: underline;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Redirection immédiate
        window.location.href = 'abonnement.html';
    </script>
</head>
<body>
    <div class="redirect-container">
        <h1>Redirection en cours...</h1>
        <div class="spinner"></div>
        <p>Vous allez être redirigé vers la page d'abonnement.</p>
        <p>Si vous n'êtes pas redirigé automatiquement, <a href="abonnement.html">cliquez ici</a>.</p>
    </div>
</body>
</html>
