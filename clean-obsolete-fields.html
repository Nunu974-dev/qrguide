<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nettoyage champs obsolètes</title>
    <style>
        body { font-family: Arial; padding: 40px; max-width: 800px; margin: 0 auto; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 8px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #result { margin-top: 20px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🧹 Nettoyage des champs obsolètes</h1>
    <p>Connectez-vous d'abord, puis cliquez sur le bouton.</p>
    
    <div id="auth-status">Vérification de la connexion...</div>
    <button id="cleanBtn" onclick="cleanObsoleteFields()" disabled>🧹 Nettoyer maintenant</button>
    <div id="result"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let currentUser = null;

        // Vérifier la connexion
        auth.onAuthStateChanged((user) => {
            const authStatus = document.getElementById('auth-status');
            const cleanBtn = document.getElementById('cleanBtn');
            
            if (user) {
                currentUser = user;
                authStatus.innerHTML = `✅ Connecté en tant que: ${user.email}`;
                cleanBtn.disabled = false;
            } else {
                authStatus.innerHTML = `❌ Non connecté - <a href="login.html">Se connecter</a>`;
                cleanBtn.disabled = true;
            }
        });

        async function cleanObsoleteFields() {
            if (!currentUser) {
                alert('Vous devez être connecté !');
                return;
            }

            const result = document.getElementById('result');
            const cleanBtn = document.getElementById('cleanBtn');
            cleanBtn.disabled = true;
            result.innerHTML = '<p>🔄 Nettoyage en cours...</p>';

            try {
                // Récupérer tous les guides
                const guidesSnapshot = await db.collection('guides').get();
                
                let cleaned = 0;
                const obsoleteFields = [
                    'menage_tri',
                    'instructions_cles', 
                    'urgences',
                    'hote_message_final'
                ];

                result.innerHTML += `<p>📋 Trouvé ${guidesSnapshot.size} guide(s)</p>`;

                for (const doc of guidesSnapshot.docs) {
                    const data = doc.data();
                    const updates = {};
                    
                    // Afficher les champs trouvés
                    result.innerHTML += `<hr><p><strong>Guide: ${data.nom || doc.id}</strong></p>`;
                    
                    // Préparer la suppression des champs obsolètes
                    obsoleteFields.forEach(field => {
                        if (data.hasOwnProperty(field)) {
                            const value = data[field];
                            const preview = typeof value === 'string' && value.length > 50 
                                ? value.substring(0, 50) + '...' 
                                : value;
                            result.innerHTML += `<p style="color: orange;">⚠️ Champ "${field}" trouvé : "${preview}"</p>`;
                            updates[field] = firebase.firestore.FieldValue.delete();
                            cleaned++;
                        }
                    });

                    // Mettre à jour si nécessaire
                    if (Object.keys(updates).length > 0) {
                        await db.collection('guides').doc(doc.id).update(updates);
                        result.innerHTML += `<p style="color: green;">✅ ${Object.keys(updates).length} champ(s) supprimé(s)</p>`;
                    } else {
                        result.innerHTML += `<p style="color: gray;">✓ Aucun champ obsolète</p>`;
                    }
                }

                result.innerHTML += `<p class="success" style="font-weight: bold;">✅ TERMINÉ ! ${cleaned} champs obsolètes supprimés.</p>`;
                result.innerHTML += `<p>✅ Rechargez <a href="mon-compte.html">mon-compte.html</a> et votre guide</p>`;

            } catch (error) {
                result.innerHTML = `<p class="error">❌ Erreur: ${error.message}</p>`;
                console.error(error);
            } finally {
                cleanBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
