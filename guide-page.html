<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guide de séjour</title>
    <base href="/">
    <link rel="icon" type="image/jpeg" href="/img/logo_icone.jpg">
    <link rel="stylesheet" href="/demo-guide/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
</head>
<body>
    <div class="container page-container">
        <!-- Bouton retour -->
        <a href="#" onclick="history.back(); return false;" class="back-button">← Retour</a>

        <!-- Image d'accueil avec titre overlay -->
        <div id="page-header" style="width: 100%; height: 200px; border-radius: 16px; overflow: hidden; margin-bottom: 24px; position: relative;">
            <img id="header-image" src="" alt="Guide" style="width: 100%; height: 100%; object-fit: cover;">
            <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.4) 100%); display: flex; align-items: center; justify-content: center;">
                <h1 id="page-title" style="color: white; font-size: 2.5rem; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.3); margin: 0;"></h1>
            </div>
        </div>

        <!-- Contenu de la page -->
        <main class="page-content" id="page-content">
            <p style="text-align: center; padding: 40px;">Chargement...</p>
        </main>
    </div>

    <script>
        // Attendre que Firebase soit chargé
        window.addEventListener('load', function() {
            // Vérifier que Firebase est bien chargé
            if (!firebase || !firebase.firestore) {
                console.error('Firebase non chargé');
                document.getElementById('page-content').innerHTML = '<p style="text-align: center; color: red;">Erreur de chargement Firebase</p>';
                return;
            }

            // Initialiser Firestore si ce n'est pas déjà fait
            const db = firebase.firestore();
            
            // Récupérer les paramètres de l'URL
            const urlParams = new URLSearchParams(window.location.search);
            const guideId = urlParams.get('guide');
            const pageType = urlParams.get('page');

            // Configuration des pages
            const pageConfig = {
            'arrivee': {
                title: '👋 Bienvenue !',
                image: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800&h=400&fit=crop&q=90'
            },
            'depart': {
                title: '🚪 Départ',
                image: 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=800&h=400&fit=crop&q=90'
            },
            'wifi': {
                title: '📶 Wi-Fi',
                image: 'https://images.unsplash.com/photo-1551817958-20c1f0650b2e?w=800&h=400&fit=crop&q=90'
            },
            'equipements': {
                title: '🏠 Équipements',
                image: 'https://images.unsplash.com/photo-1556911220-bff31c812dba?w=800&h=400&fit=crop&q=90'
            },
            'restaurants': {
                title: '🍽️ Restaurants',
                image: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&h=400&fit=crop&q=90'
            },
            'activites': {
                title: '🎯 Activités',
                image: 'https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=800&h=400&fit=crop&q=90'
            },
            'commerces': {
                title: '� À proximité',
                image: 'https://images.unsplash.com/photo-1604719312566-8912e9227c6a?w=800&h=400&fit=crop&q=90'
            },
            'urgence': {
                title: '🚨 Urgences',
                image: 'https://images.unsplash.com/photo-1516549655169-df83a0774514?w=800&h=400&fit=crop&q=90'
            },
            'hote': {
                title: '👤 Votre hôte',
                image: 'https://images.unsplash.com/photo-1560807707-8cc77767d783?w=800&h=400&fit=crop&q=90'
            },
            'infos': {
                title: 'ℹ️ Informations',
                image: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=800&h=400&fit=crop&q=90'
            }
        };

        async function loadPage() {
            if (!guideId || !pageType) {
                document.getElementById('page-content').innerHTML = '<p style="text-align: center; color: red;">Erreur : paramètres manquants</p>';
                return;
            }

            // Charger les données du guide
            const guideDoc = await db.collection('guides').doc(guideId).get();
            if (!guideDoc.exists) {
                document.getElementById('page-content').innerHTML = '<p style="text-align: center; color: red;">Guide introuvable</p>';
                return;
            }

            const data = guideDoc.data();
            const config = pageConfig[pageType];

            // Définir le titre et l'image
            document.getElementById('page-title').textContent = config.title;
            document.getElementById('header-image').src = data.photo_url || config.image;
            document.title = config.title + ' - Guide de séjour';

            // Générer le contenu selon la page
            let content = generatePageContent(pageType, data);
            document.getElementById('page-content').innerHTML = content;
        }

        function generatePageContent(pageType, data) {
            switch(pageType) {
                case 'arrivee':
                    return `
                        <section class="info-section">
                            <h2 class="section-title">✨ Vous êtes arrivés !</h2>
                            <div class="info-card">
                                <p class="info-text">${data.message_bienvenue || 'Bienvenue dans votre logement ! Nous espérons que vous passerez un séjour exceptionnel.'}</p>
                            </div>
                        </section>
                        
                        ${data.premier_pas_1 || data.premier_pas_2 || data.premier_pas_3 || data.premier_pas_4 ? `
                        <section class="info-section">
                            <h2 class="section-title">🎯 Premiers pas</h2>
                            <div class="info-card">
                                <div class="step-list">
                                    ${data.premier_pas_1 ? `<div class="step"><div class="step-number">1</div><p>${data.premier_pas_1}</p></div>` : ''}
                                    ${data.premier_pas_2 ? `<div class="step"><div class="step-number">2</div><p>${data.premier_pas_2}</p></div>` : ''}
                                    ${data.premier_pas_3 ? `<div class="step"><div class="step-number">3</div><p>${data.premier_pas_3}</p></div>` : ''}
                                    ${data.premier_pas_4 ? `<div class="step"><div class="step-number">4</div><p>${data.premier_pas_4}</p></div>` : ''}
                                </div>
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.instructions_arrivee ? `
                        <section class="info-section">
                            <h2 class="section-title">🔑 Instructions d'arrivée</h2>
                            <div class="info-card">
                                <p class="info-text" style="white-space: pre-line;">${data.instructions_arrivee.replace(/\n/g, '<br>')}</p>
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.code_acces ? `
                        <section class="info-section">
                            <h2 class="section-title">🔐 Code d'accès</h2>
                            <div class="info-card">
                                <p class="info-text"><strong>Code :</strong> <span style="font-size: 1.5rem; color: var(--primary-color); font-weight: 700;">${data.code_acces}</span></p>
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.checkin_time || data.checkout_time ? `
                        <section class="info-section">
                            <h2 class="section-title">⏰ Horaires</h2>
                            <div class="info-card">
                                <div class="info-list">
                                    ${data.checkin_time ? `<p>🟢 <strong>Arrivée :</strong> à partir de ${data.checkin_time}</p>` : ''}
                                    ${data.checkout_time ? `<p>🔴 <strong>Départ :</strong> avant ${data.checkout_time}</p>` : ''}
                                </div>
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.parking_info ? `
                        <section class="info-section">
                            <h2 class="section-title">🅿️ Parking</h2>
                            <div class="info-card">
                                <p class="info-text">${data.parking_info.replace(/\n/g, '<br>')}</p>
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.wifi_nom || data.wifi_password ? `
                        <section class="info-section">
                            <h2 class="section-title">📶 Wi-Fi</h2>
                            <div class="info-card">
                                <div class="info-list">
                                    ${data.wifi_nom ? `<p>📡 <strong>Réseau :</strong> ${data.wifi_nom}</p>` : ''}
                                    ${data.wifi_password ? `<p>🔒 <strong>Mot de passe :</strong> ${data.wifi_password}</p>` : ''}
                                </div>
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.hote_telephone ? `
                        <section class="info-section">
                            <h2 class="section-title">📞 Besoin d'aide ?</h2>
                            <div class="info-card">
                                <p class="info-text">N'hésitez pas à nous contacter pour toute question :</p>
                                <a href="tel:${data.hote_telephone}" class="contact-button">
                                    📱 Appeler votre hôte
                                </a>
                                <p class="contact-number">${data.hote_telephone}</p>
                            </div>
                        </section>
                        ` : ''}
                    `;

                case 'depart':
                    return `
                        <section class="info-section">
                            <h2 class="section-title">⏰ Heure de départ</h2>
                            <div class="info-card">
                                <p class="info-text" style="font-size: 1.1rem; margin-bottom: 8px;">
                                    Check-out avant <strong style="color: var(--primary-color); font-size: 1.3rem;">${data.checkout_time || '11h00'}</strong>
                                </p>
                                <p class="info-note">💬 Un départ tardif ? Contactez-nous, c'est parfois possible !</p>
                            </div>
                        </section>
                        
                        <section class="info-section">
                            <h2 class="section-title">✅ Checklist départ</h2>
                            <div class="info-card">
                                <p class="info-note" style="margin-bottom: 16px;">Quelques petits gestes avant de partir :</p>
                                <div class="checklist">
                                    <label class="checklist-item">
                                        <input type="checkbox">
                                        <span>💡 Éteindre toutes les lumières</span>
                                    </label>
                                    <label class="checklist-item">
                                        <input type="checkbox">
                                        <span>❄️ Éteindre climatisation / chauffage</span>
                                    </label>
                                    <label class="checklist-item">
                                        <input type="checkbox">
                                        <span>🪟 Fermer les fenêtres</span>
                                    </label>
                                    <label class="checklist-item">
                                        <input type="checkbox">
                                        <span>🗑️ Sortir les poubelles (si possible)</span>
                                    </label>
                                    <label class="checklist-item">
                                        <input type="checkbox">
                                        <span>🍽️ Ranger la vaisselle</span>
                                    </label>
                                </div>
                            </div>
                        </section>
                        
                        ${data.menage_tri ? `
                        <section class="info-section">
                            <h2 class="section-title">🧹 Concernant le ménage</h2>
                            <div class="info-card">
                                <div style="white-space: pre-line;">${data.menage_tri.replace(/\n/g, '<br>')}</div>
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.instructions_cles ? `
                        <section class="info-section">
                            <h2 class="section-title">🔑 Les clés</h2>
                            <div class="info-card">
                                <div style="white-space: pre-line;">${data.instructions_cles.replace(/\n/g, '<br>')}</div>
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.instructions_depart ? `
                        <section class="info-section">
                            <h2 class="section-title">📜 Instructions supplémentaires</h2>
                            <div class="info-card">
                                <div style="white-space: pre-line;">${data.instructions_depart.replace(/\n/g, '<br>')}</div>
                            </div>
                        </section>
                        ` : ''}
                        
                        <section class="info-section" style="margin-top: 32px;">
                            <div style="background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.1) 0%, rgba(var(--primary-rgb), 0.05) 100%); 
                                        border: 2px solid rgba(var(--primary-rgb), 0.3); 
                                        border-radius: 16px; 
                                        padding: 32px 24px; 
                                        text-align: center;">
                                <div style="font-size: 2.5rem; margin-bottom: 16px;">💙</div>
                                <p style="font-size: 1.3rem; font-weight: 700; margin-bottom: 12px; color: var(--primary-color);">
                                    Merci pour votre séjour !
                                </p>
                                <p style="font-size: 1rem; line-height: 1.6; color: #333;">
                                    Nous espérons que vous avez passé un moment exceptionnel.
                                </p>
                            </div>
                        </section>
                    `;

                case 'wifi':
                    return `
                        <section class="info-section">
                            <h2 class="section-title">� Connexion WiFi</h2>
                            <div class="info-card">
                                ${data.wifi_nom ? `<p style="font-size: 0.9rem; margin-bottom: 8px; color: #666;">Nom du réseau</p><p style="font-size: 1.3rem; font-weight: 700; color: #333; margin: 0 0 12px 0;">${data.wifi_nom}</p>` : ''}
                                ${data.wifi_password ? `<p style="font-size: 0.9rem; margin-bottom: 8px; color: #666;">Mot de passe</p><p style="font-size: 1.3rem; font-weight: 700; color: #333; margin: 0 0 12px 0; letter-spacing: 1px;">${data.wifi_password}</p>` : ''}
                                ${data.wifi_debit ? `<p style="margin-top: 16px;">⚡ <strong>Débit :</strong> ${data.wifi_debit}</p>` : ''}
                            </div>
                        </section>
                        
                        ${data.tv_marque ? `
                        <section class="info-section">
                            <h2 class="section-title">📺 Télévision</h2>
                            <div class="info-card">
                                <h3 style="font-size: 1.3rem; margin-bottom: 20px; color: var(--primary-color);">${data.tv_marque}</h3>
                                
                                ${data.tv_plateformes ? `
                                <div style="margin-bottom: 24px;">
                                    <p style="font-weight: 600; margin-bottom: 12px;">🎬 Plateformes disponibles</p>
                                    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                                        ${data.tv_plateformes.split(',').map(p => `<div style="padding: 8px 16px; background: var(--primary-color); color: white; border-radius: 8px; font-weight: 600; font-size: 0.9rem;">${p.trim()}</div>`).join('')}
                                    </div>
                                </div>
                                ` : ''}
                                
                                ${data.tv_box ? `<p style="padding: 16px; background: rgba(var(--primary-rgb), 0.08); border-radius: 12px; margin-bottom: 20px;">📡 <strong>Box TV :</strong> ${data.tv_box}</p>` : ''}
                                
                                ${data.tv_instruction_1 || data.tv_instruction_2 || data.tv_instruction_3 ? `
                                <p style="font-weight: 600; margin-bottom: 12px;">🎮 Mode d'emploi</p>
                                <div class="step-list">
                                    ${data.tv_instruction_1 ? `<div class="step"><div class="step-number">1</div><div><p style="font-weight: 600;">Allumer la TV</p><p style="font-size: 0.9rem; color: #666; margin-top: 4px;">${data.tv_instruction_1}</p></div></div>` : ''}
                                    ${data.tv_instruction_2 ? `<div class="step"><div class="step-number">2</div><div><p style="font-weight: 600;">Changer de source</p><p style="font-size: 0.9rem; color: #666; margin-top: 4px;">${data.tv_instruction_2}</p></div></div>` : ''}
                                    ${data.tv_instruction_3 ? `<div class="step"><div class="step-number">3</div><div><p style="font-weight: 600;">Régler le volume</p><p style="font-size: 0.9rem; color: #666; margin-top: 4px;">${data.tv_instruction_3}</p></div></div>` : ''}
                                </div>
                                ` : ''}
                                
                                ${data.tv_telecommande_emplacement ? `<p style="margin-top: 16px; padding: 12px; background: rgba(var(--primary-rgb), 0.05); border-radius: 8px;">📍 <strong>Télécommandes :</strong> ${data.tv_telecommande_emplacement}</p>` : ''}
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.enceinte_marque ? `
                        <section class="info-section">
                            <h2 class="section-title">🔊 Enceinte Bluetooth</h2>
                            <div class="info-card">
                                <h3 style="font-size: 1.3rem; margin-bottom: 20px; color: var(--primary-color);">${data.enceinte_marque}</h3>
                                ${data.enceinte_nom_bluetooth ? `<p style="margin-bottom: 12px;">📱 <strong>Nom Bluetooth :</strong> ${data.enceinte_nom_bluetooth}</p>` : ''}
                                ${data.enceinte_caracteristiques ? `<p style="margin-bottom: 16px;">${data.enceinte_caracteristiques}</p>` : ''}
                                ${data.enceinte_emplacement || data.enceinte_chargeur ? `
                                <div style="margin-top: 20px; padding: 16px; background: rgba(var(--primary-rgb), 0.05); border-radius: 12px;">
                                    ${data.enceinte_emplacement ? `<p style="margin: 0 0 8px 0;">📍 <strong>Emplacement :</strong> ${data.enceinte_emplacement}</p>` : ''}
                                    ${data.enceinte_chargeur ? `<p style="margin: 0;">🔌 <strong>Chargeur :</strong> ${data.enceinte_chargeur}</p>` : ''}
                                </div>
                                ` : ''}
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.multimedia_bureau || data.multimedia_prises_usb || data.multimedia_chargeurs ? `
                        <section class="info-section">
                            <h2 class="section-title">🎮 Autres équipements</h2>
                            <div class="info-card">
                                ${data.multimedia_bureau ? `<p>💻 <strong>Bureau :</strong> ${data.multimedia_bureau}</p>` : ''}
                                ${data.multimedia_prises_usb ? `<p>🔌 <strong>Prises USB :</strong> ${data.multimedia_prises_usb}</p>` : ''}
                                ${data.multimedia_chargeurs ? `<p>📱 <strong>Chargeurs :</strong> ${data.multimedia_chargeurs}</p>` : ''}
                            </div>
                        </section>
                        ` : ''}
                    `;

                case 'equipements':
                    return `
                        ${data.cuisine_plaques || data.cuisine_four || data.cuisine_cafe || data.cuisine_frigo || data.cuisine_lave_vaisselle || data.cuisine_autres ? `
                        <section class="info-section">
                            <h2 class="section-title">🍳 Cuisine équipée</h2>
                            <div class="info-card">
                                <div style="display: grid; gap: 12px;">
                                    ${data.cuisine_plaques ? `<div style="display: flex; gap: 14px; padding: 14px; background: rgba(var(--primary-rgb), 0.05); border-radius: 12px; border: 2px solid rgba(var(--primary-rgb), 0.15);"><div style="font-size: 2rem; flex-shrink: 0;">🔥</div><div style="flex: 1;"><p style="font-weight: 600; margin: 0 0 4px 0;">Plaques de cuisson</p><p style="font-size: 0.9rem; color: #666; margin: 0;">${data.cuisine_plaques}</p></div></div>` : ''}
                                    ${data.cuisine_four ? `<div style="display: flex; gap: 14px; padding: 14px; background: rgba(var(--primary-rgb), 0.05); border-radius: 12px; border: 2px solid rgba(var(--primary-rgb), 0.15);"><div style="font-size: 2rem; flex-shrink: 0;">🌡️</div><div style="flex: 1;"><p style="font-weight: 600; margin: 0 0 4px 0;">Four</p><p style="font-size: 0.9rem; color: #666; margin: 0;">${data.cuisine_four}</p></div></div>` : ''}
                                    ${data.cuisine_cafe ? `<div style="display: flex; gap: 14px; padding: 14px; background: rgba(var(--primary-rgb), 0.05); border-radius: 12px; border: 2px solid rgba(var(--primary-rgb), 0.15);"><div style="font-size: 2rem; flex-shrink: 0;">☕</div><div style="flex: 1;"><p style="font-weight: 600; margin: 0 0 4px 0;">Machine à café</p><p style="font-size: 0.9rem; color: #666; margin: 0;">${data.cuisine_cafe}</p></div></div>` : ''}
                                    ${data.cuisine_frigo ? `<div style="display: flex; gap: 14px; padding: 14px; background: rgba(var(--primary-rgb), 0.05); border-radius: 12px; border: 2px solid rgba(var(--primary-rgb), 0.15);"><div style="font-size: 2rem; flex-shrink: 0;">❄️</div><div style="flex: 1;"><p style="font-weight: 600; margin: 0 0 4px 0;">Réfrigérateur</p><p style="font-size: 0.9rem; color: #666; margin: 0;">${data.cuisine_frigo}</p></div></div>` : ''}
                                    ${data.cuisine_lave_vaisselle ? `<div style="display: flex; gap: 14px; padding: 14px; background: rgba(var(--primary-rgb), 0.05); border-radius: 12px; border: 2px solid rgba(var(--primary-rgb), 0.15);"><div style="font-size: 2rem; flex-shrink: 0;">🍽️</div><div style="flex: 1;"><p style="font-weight: 600; margin: 0 0 4px 0;">Lave-vaisselle</p><p style="font-size: 0.9rem; color: #666; margin: 0;">${data.cuisine_lave_vaisselle}</p></div></div>` : ''}
                                </div>
                                ${data.cuisine_autres ? `<p style="margin-top: 12px; padding-top: 12px; border-top: 2px solid rgba(var(--primary-rgb), 0.1);"><strong>Autres équipements :</strong> ${data.cuisine_autres}</p>` : ''}
                            </div>
                        </section>
                        ` : ''}
                        
                        ${data.sdb_douche || data.sdb_produits || data.sdb_seche_cheveux || data.sdb_serviettes || data.sdb_autres ? `
                        <section class="info-section">
                            <h2 class="section-title">🚿 Salle de bain</h2>
                            <div class="info-card">
                                <div style="display: grid; gap: 12px;">
                                    ${data.sdb_douche ? `<div style="display: flex; gap: 14px; padding: 14px; background: rgba(var(--primary-rgb), 0.05); border-radius: 12px; border: 2px solid rgba(var(--primary-rgb), 0.15);"><div style="font-size: 2rem; flex-shrink: 0;">💧</div><div style="flex: 1;"><p style="font-weight: 600; margin: 0 0 4px 0;">Douche</p><p style="font-size: 0.9rem; color: #666; margin: 0;">${data.sdb_douche}</p></div></div>` : ''}
