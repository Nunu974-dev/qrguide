<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu du restaurant - QRGUIDE.FR</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/jpeg" href="img/logo_icone.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Inter,sans-serif;background:#fffaf0;color:#1a1a1a}
        header{position:relative;background:#1a1a1a url('img/resto-fond.jpg') center/cover no-repeat;color:#fff;padding:90px 20px 48px;text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
        header:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.65) 50%,rgba(26,26,26,.95))}
        header>*{position:relative}
        header h1{margin:0 0 6px;font-size:1.9rem;text-shadow:0 2px 10px rgba(0,0,0,.7)}
        header p{margin:0;font-weight:500;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}
        main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
        .special{background:#1a1a1a;color:#ffd200;padding:14px 16px;border-radius:12px;margin:8px 0 8px;font-weight:600;text-align:center}
        h2{color:#cc8800;text-transform:uppercase;letter-spacing:.05em;font-size:.95rem;margin:28px 0 8px;border-bottom:2px solid #f0e6d0;padding-bottom:6px}
        .item{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #f0e6d0}
        .item.off{opacity:.45;text-decoration:line-through}
        .item .d{color:#777;font-size:.88rem;margin-top:2px}
        .item .a{color:#c0392b;font-size:.78rem;margin-top:3px}
        .item b{white-space:nowrap}
        .btn{display:block;text-align:center;margin:28px auto 0;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600}
        .foot{text-align:center;color:#aaa;font-size:.78rem;margin-top:32px}
        .foot a{color:#aaa}
        .foot .lg{margin:6px auto 0;opacity:.8}
        .lg{width:132px;height:44px;overflow:hidden;display:block}
        .lg img{height:130px;width:auto;margin:-43px 0 0 -37px;display:block}
    </style>
</head>
<body>
    <header><h1 id="name">Chargement…</h1><p id="title"></p></header>
    <main id="content"></main>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
        (async () => {
            const id = new URLSearchParams(location.search).get('id');
            const main = document.getElementById('content');
            if (!id) { main.innerHTML = '<p>Menu introuvable.</p>'; return; }
            try {
                const doc = await db.collection('restaurants').doc(id).get();
                if (!doc.exists) { main.innerHTML = '<p>Menu introuvable.</p>'; return; }
                const r = doc.data();
                document.title = (r.name || 'Menu') + ' - Menu';
                document.getElementById('name').textContent = r.name || 'Menu';
                if (/^https:\/\//.test(r.cover || '')) document.querySelector('header').style.backgroundImage = 'url("' + r.cover.replace(/"/g, '') + '")';
                document.getElementById('title').textContent = r.title || '';
                let h = r.special ? `<div class="special">${esc(r.special)}</div>` : '';
                (r.categories || []).forEach(c => {
                    if (!(c.items || []).length) return;
                    h += `<h2>${esc(c.name)}</h2>` + c.items.map(i => `
                        <div class="item${i.dispo === false ? ' off' : ''}">
                            <div><div>${esc(i.nom)}</div>
                            ${i.desc ? `<div class="d">${esc(i.desc)}</div>` : ''}
                            ${i.allergenes ? `<div class="a">Allergènes : ${esc(i.allergenes)}</div>` : ''}</div>
                            <b>${i.prix ? esc(i.prix) + ' €' : ''}</b>
                        </div>`).join('');
                });
                if (/^https?:\/\//.test(r.reviewUrl || '')) h += `<a class="btn" href="${esc(r.reviewUrl)}" target="_blank" rel="noopener">⭐ Laisser un avis Google</a>`;
                h += '<div class="foot">Menu digital propulsé par<a href="https://qrguide.fr"><span class="lg"><img src="img/logo.png" alt="QRGUIDE.FR"></span></a></div>';
                main.innerHTML = h;
            } catch (e) { main.innerHTML = '<p>Impossible de charger le menu.</p>'; }
        })();
    </script>
</body>
</html>
