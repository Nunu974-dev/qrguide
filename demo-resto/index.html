<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Démo menu restaurant - QRGUIDE.FR</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="logo_icone.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#f7971e;--g:#ffd200;--dark:#1a1a1a;--bg:#fffaf0;--line:#f0e6d0}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--dark)}
.top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:20;pointer-events:none}
.top a,.top .lang{pointer-events:auto;background:rgba(26,26,26,.85);color:#fff;text-decoration:none;font-size:.8rem;font-weight:600;padding:8px 12px;border-radius:20px;backdrop-filter:blur(8px)}
.lang button{background:none;border:0;color:#fff;opacity:.6;cursor:pointer;font-size:1rem;padding:0 4px}
.lang button.on{opacity:1}
header{position:relative;background:#1a1a1a center/cover no-repeat;color:#fff;padding:90px 20px 56px;text-align:center;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
header:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.65) 50%,rgba(26,26,26,.95) 100%)}
header>*{position:relative}
header h1,header p,.stars,.upd{text-shadow:0 2px 10px rgba(0,0,0,.7)}
.stars{color:var(--g);letter-spacing:3px;font-size:.9rem;margin-bottom:4px}
.powered{text-align:center;margin-top:28px;opacity:.7;font-size:.72rem}
.powered .lg{margin:6px auto 0}
.lg{width:132px;height:44px;overflow:hidden;display:block}
.lg img{height:130px;width:auto;margin:-43px 0 0 -37px;display:block}
header .em{font-size:2.6rem}
header h1{margin:6px 0 4px;font-size:1.9rem}
header p{margin:0;opacity:.85}
.title{display:inline-block;margin-top:16px;background:var(--g);color:var(--dark);padding:6px 14px;border-radius:20px;font-weight:700;font-size:.85rem}
.upd{font-size:.75rem;opacity:.9;margin-top:8px}
main{max-width:680px;margin:0 auto;padding:0 16px 40px}
.special{margin:-18px 0 8px;background:#fff;border:2px solid var(--y);border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(247,151,30,.2);display:flex;justify-content:space-between;gap:12px;align-items:center}
.special small{color:var(--y);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem}
.special b{font-size:1.3rem;white-space:nowrap}
.tabs{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 0;z-index:10}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--dark);border:1px solid #e3d5b4;border-radius:20px;padding:7px 14px;font-weight:600;font-size:.85rem;background:#fff}
.tabs a.on{background:var(--dark);color:var(--g);border-color:var(--dark)}
h2{color:#cc8800;text-transform:uppercase;letter-spacing:.06em;font-size:.95rem;margin:26px 0 6px;border-bottom:2px solid var(--line);padding-bottom:6px;scroll-margin-top:60px}
.item{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.item.off{opacity:.45}.item.off .n{text-decoration:line-through}
.n{font-weight:600}.d{color:#777;font-size:.88rem;margin-top:2px}
.badges{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:.7rem;background:#fdecea;color:#c0392b;border-radius:10px;padding:2px 8px}
.soldout{font-size:.7rem;background:#eee;color:#666;border-radius:10px;padding:2px 8px}
.item b{white-space:nowrap}
.info{margin-top:30px;background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line);font-size:.9rem;line-height:1.8}
.btn{display:block;text-align:center;margin-top:14px;background:var(--dark);color:#fff;text-decoration:none;padding:13px;border-radius:12px;font-weight:700}
.btn.alt{background:linear-gradient(135deg,var(--y),var(--g));color:var(--dark)}
.demo{margin-top:26px;background:#fffbea;border:1px dashed var(--y);border-radius:12px;padding:14px;font-size:.85rem;text-align:center}
.demo a{color:#cc8800;font-weight:700}
</style>
</head>
<body>
<div class="top"><a href="../restaurants.html">← Retour au site</a><div class="lang"><button id="l-fr" class="on" onclick="setLang('fr')">🇫🇷</button><button id="l-en" onclick="setLang('en')">🇬🇧</button></div></div>
<header>
  <div class="stars">★★★★★</div>
  <h1 id="name"></h1><p id="tagline"></p>
  <div class="title" id="title"></div>
  <div class="upd" id="upd"></div>
</header>
<main>
  <div id="special"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="menu"></div>
  <div class="info" id="info"></div>
  <a class="btn alt" id="review" target="_blank" rel="noopener"></a>
  <div class="demo" id="demo"></div>
  <div class="powered">Menu digital propulsé par<span class="lg"><img src="../img/logo.png" alt="QRGUIDE.FR"></span></div>
</main>
<script src="data.js"></script>
<script>
var T={fr:{soldout:'Épuisé',allergens:'Allergènes',hours:'Horaires',wifi:'WiFi',call:'Appeler',review:'⭐ Laisser un avis Google',upd:'Mis à jour le ',demo:'Ceci est une <b>démo</b> : le restaurateur modifie ce menu depuis son <a href="admin.html">tableau de bord</a>, et il change ici instantanément.'},
       en:{soldout:'Sold out',allergens:'Allergens',hours:'Opening hours',wifi:'WiFi',call:'Call',review:'⭐ Leave a Google review',upd:'Updated ',demo:'This is a <b>demo</b>: the owner edits this menu from the <a href="admin.html">dashboard</a>, and it updates here instantly.'}};
var lang='fr',D=demoLoad();
function setLang(l){lang=l;document.getElementById('l-fr').className=l=='fr'?'on':'';document.getElementById('l-en').className=l=='en'?'on':'';render();}
function render(){
  var t=T[lang];
  document.getElementById('name').textContent=D.name;
  if(D.cover)document.querySelector('header').style.backgroundImage='url("'+D.cover.replace(/"/g,'')+'")';
  document.getElementById('tagline').textContent=D.tagline;
  document.getElementById('title').textContent=D.title;
  var u=D.updated?new Date(D.updated):new Date();
  document.getElementById('upd').textContent=t.upd+u.toLocaleDateString(lang=='fr'?'fr-FR':'en-GB',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('special').innerHTML=D.special&&D.special.on?'<div class="special"><div><small>'+esc(lang=='fr'?D.special.note:'Dish of the day')+'</small><div style="font-weight:600;margin-top:4px">'+esc(D.special.text)+'</div></div><b>'+esc(D.special.price)+' €</b></div>':'';
  var cats=D.categories.filter(function(c){return c.items.length});
  document.getElementById('tabs').innerHTML=cats.map(function(c,i){return '<a href="#c'+i+'">'+esc(lang=='en'&&c.en?c.en:c.name)+'</a>'}).join('');
  document.getElementById('menu').innerHTML=cats.map(function(c,i){
    return '<h2 id="c'+i+'">'+esc(lang=='en'&&c.en?c.en:c.name)+'</h2>'+c.items.map(function(it){
      var off=it.dispo===false;
      return '<div class="item'+(off?' off':'')+'"><div><div class="n">'+esc(lang=='en'&&it.en?it.en:it.nom)+'</div>'+(it.desc?'<div class="d">'+esc(it.desc)+'</div>':'')+
      '<div class="badges">'+(off?'<span class="soldout">'+t.soldout+'</span>':'')+(it.all?it.all.split(',').map(function(a){return '<span class="badge">'+esc(a.trim())+'</span>'}).join(''):'')+'</div></div><b>'+esc(it.prix)+' €</b></div>';}).join('');
  }).join('');
  document.getElementById('info').innerHTML='<b>🕒 '+t.hours+'</b><br>'+esc(D.hours)+'<br><b>📶 '+t.wifi+'</b> : '+esc(D.wifi)+'<br><b>📞</b> <a href="tel:'+esc(D.phone.replace(/\s/g,''))+'">'+esc(D.phone)+'</a>';
  var r=document.getElementById('review');r.textContent=t.review;r.href=D.reviewUrl||'#';
  document.getElementById('demo').innerHTML=t.demo;
}
var tabsEl=document.getElementById('tabs');
window.addEventListener('scroll',function(){var hs=document.querySelectorAll('h2'),cur=0;hs.forEach(function(h,i){if(h.getBoundingClientRect().top<90)cur=i});tabsEl.querySelectorAll('a').forEach(function(a,i){a.className=i==cur?'on':''})});
render();
</script>
</body>
</html>
